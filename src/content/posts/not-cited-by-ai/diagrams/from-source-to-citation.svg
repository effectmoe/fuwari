<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">元の案内から自社の答えへ、情報を整える流れ</title>
  <desc id="desc">元の案内、独自の実務情報、本文と要約とFAQと根拠をそろえるという3つの段階を矢印で示す図</desc>
  <rect width="1440" height="640" rx="32" fill="#fbfaf7"/>
  <text x="92" y="104" fill="#9a7020" font-family="sans-serif" font-size="25" font-weight="700" letter-spacing="3">FROM SOURCE TO A CLEAR ANSWER</text>
  <text x="92" y="160" fill="#142743" font-family="sans-serif" font-size="43" font-weight="700">元の案内を紹介するだけで終わらせず、自社の答えへ。</text>
  <g fill="none" stroke="#c49a42" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M444 370h88"/>
    <path d="M524 352l28 18-28 18"/>
    <path d="M908 370h88"/>
    <path d="M988 352l28 18-28 18"/>
  </g>
  <g font-family="sans-serif">
    <rect x="92" y="240" width="352" height="270" rx="22" fill="#fff" stroke="#d8cba8" stroke-width="3"/>
    <circle cx="136" cy="286" r="22" fill="#ead8a6"/>
    <text x="177" y="297" fill="#9a7020" font-size="24" font-weight="700">STEP 1</text>
    <text x="128" y="356" fill="#142743" font-size="34" font-weight="700">元の案内を正確に読む</text>
    <text x="128" y="408" fill="#566477" font-size="23">事実・条件・背景を確認する</text>
    <text x="128" y="451" fill="#566477" font-size="23">紹介と自社の見解を混ぜない</text>
    <rect x="128" y="470" width="183" height="8" rx="4" fill="#e8dfc7"/>

    <rect x="556" y="216" width="352" height="318" rx="22" fill="#fffaf0" stroke="#c49a42" stroke-width="4"/>
    <circle cx="600" cy="262" r="22" fill="#c49a42"/>
    <text x="641" y="273" fill="#9a7020" font-size="24" font-weight="700">STEP 2</text>
    <text x="592" y="332" fill="#142743" font-size="34" font-weight="700">自社だけの答えを足す</text>
    <text x="592" y="384" fill="#566477" font-size="23">影響の見立て</text>
    <text x="592" y="425" fill="#566477" font-size="23">準備の順番</text>
    <text x="592" y="466" fill="#566477" font-size="23">現場の見落とし</text>
    <rect x="592" y="494" width="218" height="8" rx="4" fill="#ead8a6"/>

    <rect x="1020" y="240" width="328" height="270" rx="22" fill="#fff" stroke="#9dc6c7" stroke-width="3"/>
    <circle cx="1064" cy="286" r="22" fill="#8ab6b7"/>
    <text x="1105" y="297" fill="#23696d" font-size="24" font-weight="700">STEP 3</text>
    <text x="1056" y="356" fill="#142743" font-size="34" font-weight="700">意味をそろえて伝える</text>
    <text x="1056" y="408" fill="#566477" font-size="23">本文・要約・FAQ・根拠</text>
    <text x="1056" y="451" fill="#566477" font-size="23">ページごとの説明をつなぐ</text>
    <rect x="1056" y="470" width="201" height="8" rx="4" fill="#cde3e2"/>
  </g>
  <text x="92" y="590" fill="#526071" font-family="sans-serif" font-size="23">同じ説明を増やすのではなく、読者が判断に使える情報を、自社の言葉で補います。</text>
</svg>
