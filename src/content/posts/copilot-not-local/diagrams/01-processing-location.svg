<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320" role="img" aria-labelledby="title desc">
  <title id="title">Copilotは名前ではなく処理場所で分けて確認する</title>
  <desc id="desc">端末内で処理するCopilotプラスPCのAIコンポーネントと、クラウドで処理する仕事用・個人用Copilotを上下に対比し、確認する設定と情報の扱いが変わることを示す図解。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f2fbfa"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#12314d" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1000" height="1320" rx="36" fill="url(#bg)"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif">
    <text x="70" y="100" fill="#102b48" font-size="52" font-weight="700">Copilotは、名前ではなく</text>
    <text x="70" y="165" fill="#102b48" font-size="52" font-weight="700">「処理場所」で分けて確認する</text>
    <text x="70" y="222" fill="#536b81" font-size="30">同じ名前でも、確認する設定と情報の扱いは同じではありません。</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="290" width="860" height="340" rx="30" fill="#fff" stroke="#51a99f" stroke-width="3"/>
    <rect x="70" y="760" width="860" height="340" rx="30" fill="#fff" stroke="#3978ab" stroke-width="3"/>
  </g>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif">
    <rect x="115" y="338" width="220" height="58" rx="29" fill="#dff5ef"/>
    <text x="225" y="378" text-anchor="middle" fill="#007b72" font-size="27" font-weight="700">端末内で処理</text>
    <text x="115" y="474" fill="#102b48" font-size="48" font-weight="700">Copilot+ PCのAIコンポーネント</text>
    <text x="115" y="548" fill="#526b80" font-size="34">NPUを使う機能</text>
    <text x="115" y="594" fill="#526b80" font-size="34">端末内の機能として確認する</text>

    <rect x="115" y="808" width="212" height="58" rx="29" fill="#e2edf8"/>
    <text x="221" y="848" text-anchor="middle" fill="#236a9e" font-size="27" font-weight="700">クラウドで処理</text>
    <text x="115" y="944" fill="#102b48" font-size="48" font-weight="700">仕事用・個人用のCopilot</text>
    <text x="115" y="1018" fill="#526b80" font-size="34">Word・Excel・Outlook・Teams</text>
    <text x="115" y="1064" fill="#526b80" font-size="34">モデル・保持・管理設定を確認する</text>
  </g>
  <path d="M500 650v75" fill="none" stroke="#f0a33a" stroke-width="10" stroke-linecap="round"/>
  <path d="M465 690l35 35 35-35" fill="none" stroke="#f0a33a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="70" y="1170" width="860" height="88" rx="24" fill="#112f4a"/>
  <text x="500" y="1227" text-anchor="middle" fill="#fff" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="32" font-weight="700">名前だけでは、処理場所は判断できません。</text>
</svg>
