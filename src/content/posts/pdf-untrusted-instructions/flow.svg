<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img"><title>記事の確認手順</title><rect width="720" height="660" rx="20" fill="#eff9f8"/><rect x="35" y="25" width="650" height="110" rx="15" fill="white" stroke="#2b7977" stroke-width="3"/><circle cx="85" cy="80" r="25" fill="#205e5c"/><text x="85" y="89" text-anchor="middle" font-size="27" fill="white">1</text><text x="135" y="90" font-size="29" font-family="sans-serif" fill="#163c42">外部PDFを資料として読む</text><path d="M360 144v28m-12-12 12 12 12-12" stroke="#2b7977" stroke-width="4" fill="none"/><rect x="35" y="185" width="650" height="110" rx="15" fill="white" stroke="#2b7977" stroke-width="3"/><circle cx="85" cy="240" r="25" fill="#205e5c"/><text x="85" y="249" text-anchor="middle" font-size="27" fill="white">2</text><text x="135" y="250" font-size="29" font-family="sans-serif" fill="#163c42">依頼された作業に範囲を絞る</text><path d="M360 304v28m-12-12 12 12 12-12" stroke="#2b7977" stroke-width="4" fill="none"/><rect x="35" y="345" width="650" height="110" rx="15" fill="white" stroke="#2b7977" stroke-width="3"/><circle cx="85" cy="400" r="25" fill="#205e5c"/><text x="85" y="409" text-anchor="middle" font-size="27" fill="white">3</text><text x="135" y="410" font-size="29" font-family="sans-serif" fill="#163c42">資料内の操作要求は実行しない</text><path d="M360 464v28m-12-12 12 12 12-12" stroke="#2b7977" stroke-width="4" fill="none"/><rect x="35" y="505" width="650" height="110" rx="15" fill="white" stroke="#2b7977" stroke-width="3"/><circle cx="85" cy="560" r="25" fill="#205e5c"/><text x="85" y="569" text-anchor="middle" font-size="27" fill="white">4</text><text x="135" y="570" font-size="29" font-family="sans-serif" fill="#163c42">架空の資料で動作を検査</text></svg>