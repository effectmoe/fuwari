<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">AIクローラーの巡回と人の訪問は別の段階</title>
  <desc id="desc">AIクローラー総数7218回、対話型AIの正常応答1345回、ChatGPT経由の人の訪問3人を、巡回、回答、訪問の順に示すフロー図。</desc>
  <rect width="1600" height="840" rx="34" fill="#f8f5ee"/>
  <text x="92" y="112" fill="#0e315f" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="46" font-weight="700">巡回・回答・訪問は、別の段階</text>
  <text x="92" y="166" fill="#59697b" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="25">EFFECT自社ログ（2026年6月17日〜8月24日）とGA4を照合</text>
  <path d="M514 406H610" stroke="#b98a2b" stroke-width="12" stroke-linecap="round"/>
  <path d="M588 378l36 28-36 28" fill="none" stroke="#b98a2b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1012 406H1108" stroke="#b98a2b" stroke-width="12" stroke-linecap="round"/>
  <path d="M1086 378l36 28-36 28" fill="none" stroke="#b98a2b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif">
    <rect x="92" y="256" width="422" height="320" rx="26" fill="#e9f4ff" stroke="#2d6ca8" stroke-width="4"/>
    <text x="130" y="326" fill="#1f5e99" font-size="30" font-weight="700">巡回</text>
    <text x="130" y="412" fill="#12233b" font-size="62" font-weight="700">7,218回</text>
    <text x="130" y="466" fill="#33475e" font-size="31">17種類のbotを検出</text>
    <rect x="130" y="500" width="248" height="46" rx="23" fill="#2d6ca8"/>
    <text x="158" y="534" fill="#fff" font-size="24" font-weight="700">ページを読みに来る</text>
    <rect x="590" y="256" width="422" height="320" rx="26" fill="#fdf5df" stroke="#bd8e31" stroke-width="4"/>
    <text x="628" y="326" fill="#9a6d15" font-size="30" font-weight="700">回答の材料</text>
    <text x="628" y="412" fill="#12233b" font-size="62" font-weight="700">1,345回</text>
    <text x="628" y="466" fill="#5d5032" font-size="31">対話型AIの正常応答</text>
    <rect x="628" y="500" width="278" height="46" rx="23" fill="#bd8e31"/>
    <text x="656" y="534" fill="#fff" font-size="24" font-weight="700">回答で使われるとは限らない</text>
    <rect x="1088" y="256" width="420" height="320" rx="26" fill="#eef7f2" stroke="#2f7c5d" stroke-width="4"/>
    <text x="1126" y="326" fill="#286c50" font-size="30" font-weight="700">人の訪問</text>
    <text x="1126" y="412" fill="#12233b" font-size="62" font-weight="700">3人</text>
    <text x="1126" y="466" fill="#345447" font-size="31">2026年8月のChatGPT経由</text>
    <rect x="1126" y="500" width="230" height="46" rx="23" fill="#2f7c5d"/>
    <text x="1154" y="534" fill="#fff" font-size="24" font-weight="700">人がリンクを開く</text>
  </g>
  <rect x="92" y="666" width="1416" height="86" rx="18" fill="#0e315f"/>
  <text x="132" y="722" fill="#fff" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="31" font-weight="700">見る順番：どのページが読まれたか → 回答に使える情報があるか → 訪問後に迷わない導線があるか</text>
</svg>
