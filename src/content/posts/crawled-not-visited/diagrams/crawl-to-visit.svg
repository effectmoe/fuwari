<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">AIクローラーの巡回と人の訪問は別の段階</title>
  <desc id="desc">AIクローラー総数7,218回、対話型AIの正常応答1,345回、ChatGPT経由の人の訪問3人を、巡回、回答、訪問の順に示すフロー図。各数字を混同せず、読まれたページ、回答との接点、訪問後の導線の順に確認する。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M1 1L12 7 1 13" fill="none" stroke="#b98a2b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="980" rx="36" fill="#f8f5ee"/>
  <text x="80" y="104" fill="#0e315f" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="46" font-weight="700">巡回・回答・訪問は、別の段階</text>
  <text x="80" y="156" fill="#59697b" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="25">EFFECT自社ログ（2026年6月17日〜8月24日）とGA4を照合</text>

  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif">
    <rect x="80" y="242" width="410" height="352" rx="28" fill="#e9f4ff" stroke="#2d6ca8" stroke-width="4"/>
    <text x="120" y="310" fill="#1f5e99" font-size="30" font-weight="700">巡回</text>
    <text x="120" y="400" fill="#12233b" font-size="64" font-weight="700">7,218回</text>
    <text x="120" y="456" fill="#33475e" font-size="29">17種類のAIクローラーを検出</text>
    <rect x="120" y="508" width="258" height="52" rx="26" fill="#2d6ca8"/>
    <text x="151" y="543" fill="#ffffff" font-size="24" font-weight="700">ページを読みに来る</text>

    <rect x="595" y="242" width="410" height="352" rx="28" fill="#fdf5df" stroke="#bd8e31" stroke-width="4"/>
    <text x="635" y="310" fill="#9a6d15" font-size="30" font-weight="700">回答の材料</text>
    <text x="635" y="400" fill="#12233b" font-size="64" font-weight="700">1,345回</text>
    <text x="635" y="456" fill="#5d5032" font-size="29">対話型AIで正常に応答</text>
    <rect x="635" y="508" width="300" height="52" rx="26" fill="#bd8e31"/>
    <text x="666" y="543" fill="#ffffff" font-size="22" font-weight="700">回答との接点を確かめる</text>

    <rect x="1110" y="242" width="410" height="352" rx="28" fill="#eef7f2" stroke="#2f7c5d" stroke-width="4"/>
    <text x="1150" y="310" fill="#286c50" font-size="30" font-weight="700">人の訪問</text>
    <text x="1150" y="400" fill="#12233b" font-size="64" font-weight="700">3人</text>
    <text x="1150" y="450" fill="#345447" font-size="28">2026年8月に確認できた</text>
    <text x="1150" y="486" fill="#345447" font-size="28">ChatGPT経由の訪問</text>
    <rect x="1150" y="508" width="246" height="52" rx="26" fill="#2f7c5d"/>
    <text x="1181" y="543" fill="#ffffff" font-size="24" font-weight="700">人がリンクを開く</text>
  </g>

  <g fill="none" stroke="#b98a2b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M510 418H575"/>
    <path d="M1025 418H1090"/>
  </g>
  <g fill="#9a6d15" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="542" y="380">次の段階</text>
    <text x="1057" y="380">次の段階</text>
  </g>

  <rect x="80" y="660" width="1440" height="210" rx="26" fill="#0e315f"/>
  <text x="120" y="716" fill="#dbeaff" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="25" font-weight="700">数字を混同せず、次の順番で確認する</text>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif">
    <rect x="120" y="748" width="395" height="82" rx="16" fill="#ffffff"/>
    <circle cx="157" cy="789" r="20" fill="#2d6ca8"/>
    <text x="157" y="797" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">1</text>
    <text x="195" y="783" fill="#12233b" font-size="23" font-weight="700">読まれたページを確かめる</text>
    <text x="195" y="814" fill="#59697b" font-size="18">巡回の記録を見る</text>

    <rect x="603" y="748" width="395" height="82" rx="16" fill="#ffffff"/>
    <circle cx="640" cy="789" r="20" fill="#bd8e31"/>
    <text x="640" y="797" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">2</text>
    <text x="678" y="783" fill="#12233b" font-size="23" font-weight="700">回答との接点を整える</text>
    <text x="678" y="814" fill="#59697b" font-size="18">答えに必要な情報をそろえる</text>

    <rect x="1085" y="748" width="395" height="82" rx="16" fill="#ffffff"/>
    <circle cx="1122" cy="789" r="20" fill="#2f7c5d"/>
    <text x="1122" y="797" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">3</text>
    <text x="1160" y="783" fill="#12233b" font-size="23" font-weight="700">訪問後の導線をつなぐ</text>
    <text x="1160" y="814" fill="#59697b" font-size="18">次に知りたい情報へ案内する</text>
  </g>
  <text x="80" y="932" fill="#667386" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="20">出典：EFFECT自社ログおよびGA4。各数値は異なる段階の記録であり、単純比較はできません。</text>
</svg>
