<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">プライバシーが競争優位になった事例マップ</title><desc id="desc">消費者向けサービスで起きたプライバシー重視の流れが、企業のAI基盤へ広がる様子を示す。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b68c3c"/></marker></defs>
  <rect width="1200" height="650" rx="24" fill="#fffdf8"/><text x="65" y="73" fill="#1e4e7e" font-family="sans-serif" font-size="25" font-weight="700" letter-spacing="3">PRIVACY BECOMES A REASON TO CHOOSE</text>
  <text x="65" y="123" fill="#25282d" font-family="sans-serif" font-size="34" font-weight="800">消費者の「安心して使える」が、企業のAI導入にも広がる</text>
  <path d="M160 340H1040" stroke="#b68c3c" stroke-width="6" marker-end="url(#a)"/>
  <g font-family="sans-serif"><text x="92" y="225" fill="#80631f" font-size="20" font-weight="700">消費者向け</text><text x="816" y="225" fill="#2e674d" font-size="20" font-weight="700">企業向けAI導入</text></g>
  <g font-family="sans-serif"><g transform="translate(120 265)"><rect width="190" height="146" rx="14" fill="#fbf1d7" stroke="#b68c3c" stroke-width="2"/><text x="95" y="53" text-anchor="middle" fill="#272727" font-size="25" font-weight="800">ATT</text><text x="95" y="88" text-anchor="middle" fill="#5d514c" font-size="17">追跡前に許可を求める</text><text x="95" y="116" text-anchor="middle" fill="#5d514c" font-size="17">仕組み</text></g><g transform="translate(350 265)"><rect width="190" height="146" rx="14" fill="#fbf1d7" stroke="#b68c3c" stroke-width="2"/><text x="95" y="53" text-anchor="middle" fill="#272727" font-size="25" font-weight="800">DuckDuckGo</text><text x="95" y="91" text-anchor="middle" fill="#5d514c" font-size="17">収集を最小限にする</text><text x="95" y="119" text-anchor="middle" fill="#5d514c" font-size="17">検索体験</text></g><g transform="translate(580 265)"><rect width="190" height="146" rx="14" fill="#fbf1d7" stroke="#b68c3c" stroke-width="2"/><text x="95" y="53" text-anchor="middle" fill="#272727" font-size="25" font-weight="800">Signal</text><text x="95" y="91" text-anchor="middle" fill="#5d514c" font-size="17">プライバシーを体験の</text><text x="95" y="119" text-anchor="middle" fill="#5d514c" font-size="17">中心に置く</text></g><g transform="translate(830 246)"><rect width="290" height="184" rx="14" fill="#e8f2eb" stroke="#397256" stroke-width="2"/><text x="145" y="53" text-anchor="middle" fill="#2e674d" font-size="20" font-weight="800">ベリサーブ社 / Cloudflare OS</text><text x="145" y="94" text-anchor="middle" fill="#2d3136" font-size="19" font-weight="700">機密情報を外に出さず</text><text x="145" y="123" text-anchor="middle" fill="#2d3136" font-size="19" font-weight="700">AIを業務で使う基盤へ</text><text x="145" y="158" text-anchor="middle" fill="#5d514c" font-size="16">安全性・透明性・監査性</text></g></g>
  <path d="M212 438C310 540 835 540 968 449" fill="none" stroke="#1e4e7e" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/>
  <text x="590" y="570" fill="#1e4e7e" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">プライバシーは注意書きではなく、信頼を生む商品の中身へ。</text>
</svg>
