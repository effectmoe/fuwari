<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">AIセントラルの5つの設計原則</title><desc id="desc">社内領域、AIが参照してよい範囲、人の承認境界を重ねて、5つのセキュリティ設計原則を示す図。</desc>
  <defs><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1e4e7e"/></marker></defs>
  <rect width="1200" height="810" rx="24" fill="#fffdf8"/><text x="65" y="72" fill="#1e4e7e" font-family="sans-serif" font-size="25" font-weight="700" letter-spacing="3">AI CENTRAL / BOUNDARY DESIGN</text><text x="65" y="120" fill="#25282d" font-family="sans-serif" font-size="34" font-weight="800">AIに任せる範囲と、人が判断する境界を最初に設計する</text>
  <rect x="90" y="170" width="710" height="525" rx="26" fill="#edf4ef" stroke="#397256" stroke-width="3"/><text x="124" y="215" fill="#2e674d" font-family="sans-serif" font-size="23" font-weight="800">社内領域</text>
  <rect x="155" y="254" width="575" height="280" rx="22" fill="#fffdf8" stroke="#b68c3c" stroke-width="3" stroke-dasharray="12 8"/><text x="184" y="294" fill="#80631f" font-family="sans-serif" font-size="21" font-weight="800">AIが参照してよい範囲</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="205" y="340" width="150" height="115" rx="15" fill="#e3edf6" stroke="#1e4e7e" stroke-width="2"/><text x="280" y="382" fill="#1e4e7e" font-size="21" font-weight="800">登録資料</text><text x="280" y="414" fill="#4f5c68" font-size="16">業務単位で限定</text><rect x="477" y="340" width="180" height="115" rx="15" fill="#f5ecd9" stroke="#b68c3c" stroke-width="2"/><text x="567" y="382" fill="#80631f" font-size="21" font-weight="800">社内AI</text><text x="567" y="414" fill="#5d514c" font-size="16">検索・整理・提案</text></g>
  <path d="M366 397H461" stroke="#1e4e7e" stroke-width="6" marker-end="url(#b)"/>
  <rect x="155" y="575" width="575" height="79" rx="14" fill="#fff" stroke="#397256" stroke-width="2"/><text x="443" y="623" fill="#2d3136" font-family="sans-serif" font-size="21" font-weight="800" text-anchor="middle">利用記録を残す　/　監査に耐える運用</text>
  <path d="M800 425H877" stroke="#1e4e7e" stroke-width="6" marker-end="url(#b)"/><line x1="906" y1="215" x2="906" y2="642" stroke="#b84b42" stroke-width="5" stroke-dasharray="12 8"/><text x="928" y="250" fill="#9a3c35" font-family="sans-serif" font-size="20" font-weight="800">人の承認境界</text><rect x="950" y="355" width="175" height="136" rx="16" fill="#fbefea" stroke="#b84b42" stroke-width="2"/><text x="1038" y="402" fill="#9a3c35" font-family="sans-serif" font-size="21" font-weight="800" text-anchor="middle">対外送信・確定</text><text x="1038" y="435" fill="#5d514c" font-family="sans-serif" font-size="16" text-anchor="middle">人が確認して実行</text>
  <g font-family="sans-serif" font-size="18" font-weight="700"><g transform="translate(60 720)"><circle cx="20" cy="0" r="20" fill="#1e4e7e"/><text x="20" y="7" fill="#fff" text-anchor="middle">1</text><text x="52" y="7" fill="#2d3136">渡す情報を人が決める</text></g><g transform="translate(360 720)"><circle cx="20" cy="0" r="20" fill="#1e4e7e"/><text x="20" y="7" fill="#fff" text-anchor="middle">2</text><text x="52" y="7" fill="#2d3136">境界を最初に引く</text></g><g transform="translate(630 720)"><circle cx="20" cy="0" r="20" fill="#397256"/><text x="20" y="7" fill="#fff" text-anchor="middle">3</text><text x="52" y="7" fill="#2d3136">外に出さない構成</text></g><g transform="translate(60 770)"><circle cx="20" cy="0" r="20" fill="#b68c3c"/><text x="20" y="7" fill="#fff" text-anchor="middle">4</text><text x="52" y="7" fill="#2d3136">渡す前にマスキング</text></g><g transform="translate(360 770)"><circle cx="20" cy="0" r="20" fill="#b68c3c"/><text x="20" y="7" fill="#fff" text-anchor="middle">5</text><text x="52" y="7" fill="#2d3136">利用記録を残す</text></g></g>
</svg>
