<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AI導入前セキュリティチェックリスト</title><desc id="desc">AI導入前に確認する、参照範囲、承認境界、外に出さない構成、マスキング、利用記録の5項目。</desc>
  <rect width="1200" height="700" rx="24" fill="#fffdf8"/><text x="66" y="76" fill="#1e4e7e" font-family="sans-serif" font-size="25" font-weight="700" letter-spacing="3">BEFORE YOU INTRODUCE AI</text><text x="66" y="126" fill="#25282d" font-family="sans-serif" font-size="36" font-weight="800">AI導入前セキュリティ・チェックリスト</text><text x="66" y="167" fill="#5d514c" font-family="sans-serif" font-size="20">「使えるか」ではなく、「どの設計要件を満たすか」を確認する。</text>
  <g font-family="sans-serif"><g transform="translate(66 215)"><rect width="515" height="104" rx="16" fill="#eef5f0" stroke="#78a58a" stroke-width="2"/><rect x="24" y="30" width="38" height="38" rx="7" fill="#397256"/><path d="M34 49l9 9 17-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="49" fill="#272727" font-size="21" font-weight="800">AIが参照する範囲を業務単位で決めたか</text><text x="84" y="77" fill="#5d514c" font-size="16">必要な資料だけを、最初から見える範囲に置く。</text></g><g transform="translate(620 215)"><rect width="515" height="104" rx="16" fill="#eef5f0" stroke="#78a58a" stroke-width="2"/><rect x="24" y="30" width="38" height="38" rx="7" fill="#397256"/><path d="M34 49l9 9 17-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="49" fill="#272727" font-size="21" font-weight="800">人の承認を挟む境界を引いたか</text><text x="84" y="77" fill="#5d514c" font-size="16">対外送信や確定処理をAIだけに任せない。</text></g><g transform="translate(66 345)"><rect width="515" height="104" rx="16" fill="#f9f1df" stroke="#b68c3c" stroke-width="2"/><rect x="24" y="30" width="38" height="38" rx="7" fill="#b68c3c"/><path d="M34 49l9 9 17-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="49" fill="#272727" font-size="21" font-weight="800">外に出さない構成を検討したか</text><text x="84" y="77" fill="#5d514c" font-size="16">機密度に応じて、社内・手元で完結させる。</text></g><g transform="translate(620 345)"><rect width="515" height="104" rx="16" fill="#f9f1df" stroke="#b68c3c" stroke-width="2"/><rect x="24" y="30" width="38" height="38" rx="7" fill="#b68c3c"/><path d="M34 49l9 9 17-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="49" fill="#272727" font-size="21" font-weight="800">渡す前のマスキングを決めたか</text><text x="84" y="77" fill="#5d514c" font-size="16">個人情報を含む箇所を、渡す前に保護する。</text></g><g transform="translate(343 476)"><rect width="515" height="104" rx="16" fill="#e8eff6" stroke="#1e4e7e" stroke-width="2"/><rect x="24" y="30" width="38" height="38" rx="7" fill="#1e4e7e"/><path d="M34 49l9 9 17-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="49" fill="#272727" font-size="21" font-weight="800">利用の記録が残るか</text><text x="84" y="77" fill="#5d514c" font-size="16">何を参照し、どう使ったかを後から追える。</text></g></g>
  <text x="600" y="647" fill="#1e4e7e" font-family="sans-serif" font-size="24" font-weight="800" text-anchor="middle">不安を、導入を止める理由ではなく、設計の要件に変える。</text>
</svg>
