name = "brain-effect-moe"
pages_build_output_dir = "dist"
compatibility_date = "2026-04-22"

[[d1_databases]]
binding = "effect_moe_inquiries"
database_name = "effect-moe-inquiries"
database_id = "b4fe76fc-e83c-44d5-9bec-37592b7c3e55"

[[d1_databases]]
binding = "brain_knowledge"
database_name = "brain-knowledge"
database_id = "6a074384-8075-490f-8393-59225a707cd2"

# AIクローラー巡回ログ（週次レポートの一次データ源）
# Cloudflare Pages には access_log が無いため、_middleware.ts が AI bot の
# リクエストだけをここに記録する。ローカル DuckDB へは effectmoe-crawler-sync.py が同期。
[[d1_databases]]
binding = "effect_moe_crawler"
database_name = "effect-moe-crawler"
database_id = "dd76e417-0241-4a82-b363-1a1eb0f4736c"
