<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="title desc">
  <title id="title">SEOとLLMOの情報経路の違い</title>
  <desc id="desc">SEOは検索結果からページ訪問、LLMOは質問、AIの回答、根拠ページへ至る流れを並べて示す図。</desc>
  <rect width="940" height="420" fill="#fff"/>
  <text x="58" y="62" fill="#8b6a25" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">TWO PATHS, ONE TRUSTWORTHY SOURCE</text>
  <path d="M58 112H882M58 307H882" stroke="#d8ceb9" stroke-width="2"/>
  <text x="58" y="163" fill="#1c1b1b" font-family="system-ui, sans-serif" font-size="22" font-weight="800">SEO</text>
  <text x="58" y="225" fill="#655f55" font-family="system-ui, sans-serif" font-size="16">検索結果で見つけてもらい、ページへ訪問する。</text>
  <g font-family="system-ui, sans-serif" font-size="18" font-weight="750" fill="#1c1b1b">
    <rect x="313" y="137" width="168" height="55" rx="5" fill="#f7f3eb" stroke="#1c1b1b" stroke-width="2"/>
    <text x="397" y="172" text-anchor="middle">検索結果</text>
    <rect x="647" y="137" width="176" height="55" rx="5" fill="#fff" stroke="#1c1b1b" stroke-width="2"/>
    <text x="735" y="172" text-anchor="middle">ページ訪問</text>
  </g>
  <path d="M500 164H624" stroke="#b68c3c" stroke-width="3"/><path d="M610 152l16 12-16 12" fill="none" stroke="#b68c3c" stroke-width="3"/>
  <text x="58" y="357" fill="#1c1b1b" font-family="system-ui, sans-serif" font-size="22" font-weight="800">LLMO</text>
  <g font-family="system-ui, sans-serif" font-size="18" font-weight="750" fill="#1c1b1b">
    <rect x="190" y="330" width="146" height="55" rx="5" fill="#fff" stroke="#1c1b1b" stroke-width="2"/>
    <text x="263" y="365" text-anchor="middle">質問</text>
    <rect x="421" y="330" width="166" height="55" rx="5" fill="#fdf5e1" stroke="#b68c3c" stroke-width="2"/>
    <text x="504" y="365" text-anchor="middle">AIの回答</text>
    <rect x="672" y="330" width="168" height="55" rx="5" fill="#fff" stroke="#1c1b1b" stroke-width="2"/>
    <text x="756" y="365" text-anchor="middle">根拠ページ</text>
  </g>
  <path d="M351 357H398M602 357H649" stroke="#b68c3c" stroke-width="3"/><path d="M384 345l16 12-16 12M635 345l16 12-16 12" fill="none" stroke="#b68c3c" stroke-width="3"/>
</svg>
