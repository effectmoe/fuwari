<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">ユーザーの質問から根拠ページまでのAI検索の情報経路</title>
  <desc id="desc">ユーザーの質問、AIの解釈、根拠ページを細い線でつないだLLMOの情報経路図。</desc>
  <rect width="960" height="600" fill="#fbf8f2"/>
  <path d="M96 105H864M96 496H864" stroke="#d8ceb9" stroke-width="2"/>
  <text x="96" y="77" fill="#8b6a25" font-family="system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="3">AI SEARCH INFORMATION PATH</text>
  <path d="M182 312H406M554 312H778" stroke="#b68c3c" stroke-width="3" fill="none"/>
  <path d="M388 300l20 12-20 12M760 300l20 12-20 12" fill="none" stroke="#b68c3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(96 184)">
    <circle cx="86" cy="128" r="84" fill="#fff" stroke="#1c1b1b" stroke-width="3"/>
    <path d="M48 97c0-18 15-33 33-33h24c18 0 33 15 33 33v24c0 18-15 33-33 33H89l-22 18 5-18c-14-4-24-17-24-33V97Z" fill="none" stroke="#1c1b1b" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="80" cy="109" r="4" fill="#b68c3c"/><circle cx="93" cy="109" r="4" fill="#b68c3c"/><circle cx="106" cy="109" r="4" fill="#b68c3c"/>
    <text x="86" y="250" text-anchor="middle" fill="#1c1b1b" font-family="system-ui, sans-serif" font-size="23" font-weight="800">ユーザーの質問</text>
    <text x="86" y="281" text-anchor="middle" fill="#655f55" font-family="system-ui, sans-serif" font-size="16">知りたいことを尋ねる</text>
  </g>
  <g transform="translate(394 184)">
    <circle cx="86" cy="128" r="84" fill="#fdf5e1" stroke="#b68c3c" stroke-width="3"/>
    <path d="M57 98h58v58H57zM71 84h58v58H71z" fill="none" stroke="#1c1b1b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M78 113h44M78 128h28" stroke="#b68c3c" stroke-width="4" stroke-linecap="round"/>
    <text x="86" y="250" text-anchor="middle" fill="#1c1b1b" font-family="system-ui, sans-serif" font-size="23" font-weight="800">AIの解釈</text>
    <text x="86" y="281" text-anchor="middle" fill="#655f55" font-family="system-ui, sans-serif" font-size="16">情報の意味を読み取る</text>
  </g>
  <g transform="translate(692 184)">
    <circle cx="86" cy="128" r="84" fill="#fff" stroke="#1c1b1b" stroke-width="3"/>
    <path d="M59 76h47l22 22v78H59z" fill="none" stroke="#1c1b1b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M106 76v23h22M75 121h37M75 139h37" stroke="#b68c3c" stroke-width="4" stroke-linecap="round"/>
    <text x="86" y="250" text-anchor="middle" fill="#1c1b1b" font-family="system-ui, sans-serif" font-size="23" font-weight="800">根拠ページ</text>
    <text x="86" y="281" text-anchor="middle" fill="#655f55" font-family="system-ui, sans-serif" font-size="16">答えの裏づけを示す</text>
  </g>
  <text x="96" y="544" fill="#655f55" font-family="system-ui, sans-serif" font-size="17">LLMO対策は、AIが説明を組み立てる材料を、ページ上で矛盾なく届けるための情報設計です。</text>
</svg>
