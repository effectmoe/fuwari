<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">AIに紹介されるための改善ロードマップを作る漫画パネル</title>
  <desc id="desc">AI CRAWLとAI CITATIONを見比べ、更新日、事例、内部リンク、FAQなどの改善ロードマップへ落とし込む4コマ漫画の4枚目。</desc>
  <rect width="960" height="720" fill="#f8f4ee"/>
  <rect x="56" y="56" width="848" height="608" rx="34" fill="#fffdf8" stroke="#d8cbb8" stroke-width="6"/>
  <text x="96" y="118" font-family="sans-serif" font-size="36" font-weight="800" fill="#916f12">04 次の一手を決める</text>
  <rect x="104" y="170" width="752" height="92" rx="20" fill="#eef3ed" stroke="#54704f" stroke-width="4"/>
  <text x="140" y="228" font-family="sans-serif" font-size="30" font-weight="800" fill="#263225">Crawl × Citation = 原因の切り分け</text>
  <g font-family="sans-serif" font-size="25" font-weight="800" fill="#222">
    <rect x="120" y="310" width="320" height="74" rx="18" fill="#f2eee6"/>
    <text x="152" y="358">更新日を明示</text>
    <rect x="520" y="310" width="320" height="74" rx="18" fill="#f2eee6"/>
    <text x="552" y="358">事例を増やす</text>
    <rect x="120" y="420" width="320" height="74" rx="18" fill="#f2eee6"/>
    <text x="152" y="468">FAQを整理</text>
    <rect x="520" y="420" width="320" height="74" rx="18" fill="#f2eee6"/>
    <text x="552" y="468">内部リンクをつなぐ</text>
  </g>
  <rect x="108" y="555" width="744" height="72" rx="22" fill="#3f2f20"/>
  <text x="140" y="603" font-family="sans-serif" font-size="27" font-weight="800" fill="#fff">数字を見て、紹介されるページ設計へ進む。</text>
</svg>
