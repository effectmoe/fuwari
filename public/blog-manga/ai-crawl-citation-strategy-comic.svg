<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
  <title id="title">AI CRAWLとAI CITATIONの違いを説明する4コマ漫画</title>
  <desc id="desc">サイト担当者とAIアシスタントの会話で、AIに読まれることとAIに紹介されることの違いを説明する4コマ漫画。</desc>
  <defs>
    <style>
      .paper { fill: #fffdf8; }
      .ink { fill: #171717; }
      .muted { fill: #5e5a52; }
      .green { fill: #315b37; }
      .gold { fill: #9b7318; }
      .line { stroke: #171717; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #171717; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .panel-title { font: 900 34px/1.2 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: .02em; }
      .bubble-text { font: 900 28px/1.35 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
      .small { font: 800 21px/1.35 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
      .caption { font: 950 36px/1.25 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
      .sound { font: 950 44px/1 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1b1b1b" flood-opacity=".14"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#eadfcf"/>
    </pattern>
  </defs>

  <rect width="1080" height="1440" fill="#f3eee6"/>
  <rect x="34" y="34" width="1012" height="1372" rx="34" class="paper" filter="url(#softShadow)"/>
  <text x="72" y="98" class="small gold">MANGA TL;DR</text>
  <text x="72" y="146" class="caption ink">AIに読まれるページと、紹介されるページは違う</text>

  <!-- Panel 1 -->
  <g transform="translate(72 190)">
    <rect width="936" height="270" rx="18" fill="#fff" stroke="#171717" stroke-width="6"/>
    <rect width="936" height="270" rx="18" fill="url(#dots)" opacity=".38"/>
    <text x="26" y="44" class="panel-title green">1. 読まれている？</text>
    <g transform="translate(42 82)">
      <circle cx="70" cy="56" r="38" fill="#f1c89a" class="thin"/>
      <path d="M31 55 Q70 15 109 55" fill="#26231f" class="thin"/>
      <path d="M35 102 Q70 80 105 102 L118 176 L22 176 Z" fill="#f8f2e9" class="line"/>
      <circle cx="56" cy="58" r="5" class="ink"/>
      <circle cx="84" cy="58" r="5" class="ink"/>
      <path d="M58 76 Q70 84 84 76" fill="none" class="thin"/>
    </g>
    <path d="M190 72 h382 a28 28 0 0 1 28 28 v66 a28 28 0 0 1-28 28 H252 l-45 42 14-42 h-31 a28 28 0 0 1-28-28 v-66 a28 28 0 0 1 28-28Z" fill="#fff" class="line"/>
    <text x="218" y="121" class="bubble-text ink">AIからアクセスはある。</text>
    <text x="218" y="163" class="bubble-text ink">でも問い合わせは増えない…</text>
    <g transform="translate(684 72)">
      <rect x="0" y="0" width="190" height="132" rx="18" fill="#eaf2e7" class="thin"/>
      <text x="24" y="42" class="small green">AI CRAWL</text>
      <path d="M36 84 h118" class="line" fill="none" stroke="#315b37"/>
      <path d="M36 108 h82" class="thin" fill="none" stroke="#9b7318"/>
    </g>
    <text x="690" y="230" class="sound gold">読まれた実績</text>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(72 490)">
    <rect width="936" height="270" rx="18" fill="#fff" stroke="#171717" stroke-width="6"/>
    <text x="26" y="44" class="panel-title green">2. 紹介されている？</text>
    <g transform="translate(730 74)">
      <circle cx="70" cy="58" r="42" fill="#d8b360" class="thin"/>
      <rect x="20" y="114" width="100" height="78" rx="24" fill="#315b37" class="line"/>
      <circle cx="54" cy="57" r="5" fill="#fff"/>
      <circle cx="86" cy="57" r="5" fill="#fff"/>
      <path d="M53 79 Q70 67 87 79" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="-6" y="222" class="small green">AI回答</text>
    </g>
    <path d="M82 76 h472 a28 28 0 0 1 28 28 v72 a28 28 0 0 1-28 28 H196 l-58 44 18-44 H82 a28 28 0 0 1-28-28 v-72 a28 28 0 0 1 28-28Z" fill="#fff" class="line"/>
    <text x="96" y="125" class="bubble-text ink">そのAI回答に、</text>
    <text x="96" y="168" class="bubble-text ink">自社名は出ていますか？</text>
    <g transform="translate(330 208)">
      <rect width="310" height="38" rx="19" fill="#f0e8d9"/>
      <text x="22" y="27" class="small gold">AI CITATIONで確認</text>
    </g>
  </g>

  <!-- Panel 3 -->
  <g transform="translate(72 790)">
    <rect width="936" height="270" rx="18" fill="#fff" stroke="#171717" stroke-width="6"/>
    <rect x="612" y="26" width="286" height="210" rx="16" fill="#f6f1e8" class="thin"/>
    <text x="26" y="44" class="panel-title green">3. 同じ会社でも、聞き方で変わる</text>
    <g transform="translate(50 88)">
      <rect width="500" height="42" rx="21" fill="#eaf2e7"/>
      <text x="24" y="29" class="small green">会社名で聞く → 出る</text>
      <rect y="64" width="500" height="42" rx="21" fill="#fff4dc"/>
      <text x="24" y="93" class="small gold">主力サービスで聞く → 出ない</text>
      <rect y="128" width="500" height="42" rx="21" fill="#f3eeee"/>
      <text x="24" y="157" class="small muted">知らない人の質問で出るかが本番</text>
    </g>
    <text x="640" y="76" class="small gold">クエリ別スコア</text>
    <text x="640" y="126" class="caption green">29/140</text>
    <text x="640" y="170" class="small muted">露出と引用を</text>
    <text x="640" y="202" class="small muted">分けて読む</text>
  </g>

  <!-- Panel 4 -->
  <g transform="translate(72 1090)">
    <rect width="936" height="270" rx="18" fill="#fff" stroke="#171717" stroke-width="6"/>
    <text x="26" y="44" class="panel-title green">4. だから、次に直す場所が分かる</text>
    <g transform="translate(48 86)">
      <circle cx="68" cy="54" r="38" fill="#f1c89a" class="thin"/>
      <path d="M31 54 Q68 16 105 54" fill="#26231f" class="thin"/>
      <rect x="18" y="98" width="104" height="82" rx="24" fill="#f8f2e9" class="line"/>
      <circle cx="54" cy="56" r="5" class="ink"/>
      <circle cx="82" cy="56" r="5" class="ink"/>
      <path d="M55 74 Q68 84 83 74" fill="none" class="thin"/>
    </g>
    <path d="M182 74 h420 a28 28 0 0 1 28 28 v84 a28 28 0 0 1-28 28 H248 l-50 42 15-42 h-31 a28 28 0 0 1-28-28 v-84 a28 28 0 0 1 28-28Z" fill="#fff" class="line"/>
    <text x="218" y="122" class="bubble-text ink">読まれ方と紹介され方を</text>
    <text x="218" y="164" class="bubble-text ink">重ねると、打ち手が見える。</text>
    <g transform="translate(684 74)">
      <rect width="184" height="126" rx="18" fill="#315b37" class="thin"/>
      <text x="24" y="45" class="small" fill="#fff">次の改善</text>
      <path d="M34 76 h108" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <path d="M34 102 h78" stroke="#d8b360" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text x="664" y="238" class="sound gold">戦略へ</text>
  </g>
</svg>
