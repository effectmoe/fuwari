<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">AIがサイトを読みに来ている漫画パネル</title>
  <desc id="desc">AIとの接点はあるが、まだ紹介されたとは限らないことを示す4コマ漫画の1枚目。</desc>
  <rect width="960" height="720" fill="#f8f4ee"/>
  <rect x="56" y="56" width="848" height="608" rx="34" fill="#fffdf8" stroke="#d8cbb8" stroke-width="6"/>
  <text x="96" y="118" font-family="sans-serif" font-size="36" font-weight="800" fill="#916f12">01 AIが読みに来る</text>
  <rect x="110" y="170" width="360" height="300" rx="18" fill="#eff4ef" stroke="#55764d" stroke-width="4"/>
  <text x="150" y="230" font-family="sans-serif" font-size="30" font-weight="800" fill="#263225">AI接点あり</text>
  <text x="150" y="285" font-family="sans-serif" font-size="24" font-weight="700" fill="#4b5a4a">読まれた可能性</text>
  <text x="150" y="330" font-family="sans-serif" font-size="24" font-weight="700" fill="#4b5a4a">ページ別の傾向</text>
  <text x="150" y="375" font-family="sans-serif" font-size="24" font-weight="700" fill="#4b5a4a">次に見る候補</text>
  <circle cx="660" cy="300" r="94" fill="#d7a030"/>
  <circle cx="635" cy="280" r="14" fill="#fff8e8"/>
  <circle cx="685" cy="280" r="14" fill="#fff8e8"/>
  <path d="M620 340 Q660 370 700 340" fill="none" stroke="#fff8e8" stroke-width="10" stroke-linecap="round"/>
  <path d="M470 310 C530 250 560 245 590 265" fill="none" stroke="#916f12" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 12"/>
  <rect x="108" y="520" width="744" height="92" rx="22" fill="#3f6f44"/>
  <text x="140" y="580" font-family="sans-serif" font-size="30" font-weight="800" fill="#fff">読みに来た記録は残る。ここが AI CRAWL。</text>
</svg>
