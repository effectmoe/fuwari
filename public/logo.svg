<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="構造化脳ブログ ロゴ">
  <!-- 背景：シンプルなモノクロ正方形 -->
  <rect width="512" height="512" rx="64" fill="#0a0a0a"/>
  <!-- 4分割の構造化グリッド：左上「構」右上「造」左下「化」右下「脳」 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    <text x="170" y="186" font-size="160">構</text>
    <text x="342" y="186" font-size="160">造</text>
    <text x="170" y="358" font-size="160">化</text>
    <text x="342" y="358" font-size="160">脳</text>
  </g>
  <!-- 中央十字線でグリッド構造を可視化（薄め） -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2">
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
  </g>
</svg>
