<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AIエージェントの作り方：Claude Codeで業務を組み立てる手順</title>
  <desc id="desc">Claude Code、指示、確認、業務の流れをカードで示す図解</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7f4ff"/>
      <stop offset="1" stop-color="#eaf6f8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1">
      <stop stop-color="#1c2556"/>
      <stop offset="1" stop-color="#3e2f78"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d2c58" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1470" cy="90" r="320" fill="#dcd3ff" opacity=".45"/>
  <circle cx="90" cy="850" r="250" fill="#bfece5" opacity=".5"/>
  <g fill="none" stroke="#9bb7ce" stroke-width="2" opacity=".32">
    <path d="M60 170H430V95H655"/>
    <path d="M1280 195h190v255H1305"/>
    <path d="M95 700h180v95h365"/>
  </g>
  <g transform="translate(96 106)">
    <text x="0" y="0" fill="#6f51c8" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="5">AI AGENT HOW-TO</text>
    <text x="0" y="92" fill="#17213f" font-family="Arial, sans-serif" font-size="70" font-weight="800">AIエージェントの</text>
    <text x="0" y="170" fill="#17213f" font-family="Arial, sans-serif" font-size="70" font-weight="800">作り方</text>
    <rect x="0" y="208" width="480" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="267" fill="#44516d" font-family="Arial, sans-serif" font-size="29" font-weight="700">Claude Codeで、仕事の流れを組み立てる。</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="720" y="115" width="710" height="502" rx="32" fill="#fff"/>
    <rect x="720" y="115" width="710" height="80" rx="32" fill="url(#navy)"/>
    <circle cx="775" cy="155" r="10" fill="#c1b1ff"/>
    <circle cx="810" cy="155" r="10" fill="#77d9d0"/>
    <circle cx="845" cy="155" r="10" fill="#fff3a8"/>
    <text x="888" y="164" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">CLAUDE CODE</text>
    <g font-family="Arial, sans-serif">
      <text x="775" y="250" fill="#7c65ce" font-size="23" font-weight="700">STEP 01</text>
      <text x="775" y="300" fill="#18213c" font-size="34" font-weight="800">任せる仕事を決める</text>
      <rect x="775" y="330" width="250" height="78" rx="16" fill="#f0ecff"/>
      <text x="805" y="378" fill="#493e84" font-size="25" font-weight="700">調べる・整理する</text>
      <path d="M1050 370h77" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round"/>
      <path d="M1112 352l25 18-25 18" fill="none" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="775" y="475" fill="#139b91" font-size="23" font-weight="700">STEP 02</text>
      <text x="775" y="525" fill="#18213c" font-size="34" font-weight="800">指示と確認を置く</text>
      <rect x="775" y="553" width="570" height="34" rx="17" fill="#dff6f2"/>
      <rect x="775" y="553" width="390" height="34" rx="17" fill="url(#accent)"/>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="182" y="485" width="405" height="247" rx="30" fill="#fff"/>
    <rect x="182" y="485" width="405" height="14" rx="7" fill="url(#accent)"/>
    <g font-family="Arial, sans-serif">
      <text x="225" y="555" fill="#7658ca" font-size="21" font-weight="800" letter-spacing="3">WORKFLOW</text>
      <rect x="225" y="583" width="88" height="88" rx="20" fill="#f0ecff"/>
      <path d="M250 615h36M250 632h36M250 649h20" stroke="#7056c3" stroke-width="8" stroke-linecap="round"/>
      <path d="M330 628h42" stroke="#29aa9c" stroke-width="8" stroke-linecap="round"/>
      <path d="M360 610l22 18-22 18" fill="none" stroke="#29aa9c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="395" y="583" width="134" height="88" rx="20" fill="#e0f6f2"/>
      <path d="M432 628l19 20 42-47" fill="none" stroke="#139b91" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="225" y="710" fill="#24304c" font-size="25" font-weight="700">仕事 → 指示 → 確認</text>
    </g>
  </g>
  <g transform="translate(930 682)" font-family="Arial, sans-serif">
    <rect width="404" height="104" rx="24" fill="#17213f"/>
    <text x="34" y="44" fill="#a89aff" font-size="19" font-weight="800" letter-spacing="3">BUILD WITH</text>
    <text x="34" y="80" fill="#fff" font-size="29" font-weight="800">Claude Code</text>
    <path d="M338 48l22 16-22 16" fill="none" stroke="#77d9d0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
